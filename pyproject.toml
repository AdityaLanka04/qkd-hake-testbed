[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qkd-hake-testbed"
version = "0.1.0"
description = "Research testbed for signature-free hybrid QKD-PQC key exchange"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]
pqc = [
  "liboqs-python @ git+https://github.com/open-quantum-safe/liboqs-python.git",
]

[project.scripts]
qkd-hake = "qkd_hake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
